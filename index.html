<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><title>GoalMind</title><style>body{margin:0;background:#07101d;color:#fff;font-family:system-ui;padding:16px}main{max-width:700px;margin:auto}.card{background:#101c2d;border:1px solid #29405c;border-radius:16px;padding:16px;margin:12px 0}input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #39516d;background:#0a1524;color:#fff;font-size:16px}button{background:#1769e0;border:0;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fixture{padding:13px 0;border-top:1px solid #26374d}.score{font-size:26px;font-weight:800}.pill{display:inline-block;background:#172b46;border-radius:20px;padding:5px 8px;margin:3px;font-size:12px}.small{color:#9eb0c4;font-size:13px}</style></head><body><main><h1>⚽ GoalMind</h1><p class="small">Football score prediction app</p><div class="card"><h2>API-Football Key</h2><p class="small">Your key is stored only in this browser.</p><input id="key" type="password" placeholder="Paste API-Football key"><button onclick="save()">Save API Key</button><p id="msg"></p></div><div class="card"><div class="row"><select id="league"></select><input id="date" type="date"></div><button onclick="load()">Find Fixtures</button></div><div id="out" class="card"></div></main><script>const L={"Premier League":39,"Championship":40,"League One":41,"League Two":42,"Scottish Premiership":179,"La Liga":140,"Bundesliga":78,"Serie A":135,"Ligue 1":61,"Eredivisie":88,"Primeira Liga":94,"Champions League":2,"Europa League":3,"Conference League":848},K="goalmind_key",$=x=>document.getElementById(x);Object.keys(L).forEach(x=>$("league").insertAdjacentHTML("beforeend",`<option>${x}</option>`));$("date").value=new Date().toISOString().slice(0,10);if(localStorage[K])$("key").value=localStorage[K];function save(){if(!$("key").value.trim())return $("msg").textContent="Enter your API key";localStorage[K]=$("key").value.trim();$("msg").textContent="✅ API key saved"}async function api(u){return(await fetch("https://v3.football.api-sports.io/"+u,{headers:{"x-apisports-key":localStorage[K]}})).json()}async function load(){if(!localStorage[K])return $("out").textContent="Please save your API key first.";$("out").textContent="Loading…";let d=await api(`fixtures?league=${L[$("league").value]}&season=2026&date=${$("date").value}`),a=d.response||[];$("out").innerHTML=a.length?a.map(f=>`<div class="fixture"><b>${f.teams.home.name} vs ${f.teams.away.name}</b><div class="small">${f.fixture.status.long}</div><button onclick="pred(${f.fixture.id},this)">🤖 Predict Score</button><div id="p${f.fixture.id}"></div></div>`).join(""):"No fixtures found."}async function pred(id,b){b.disabled=true;b.textContent="Calculating…";let d=await api("predictions?fixture="+id),x=d.response?.[0]?.predictions;if(x){$("p"+id).innerHTML=`<div class="card"><div class="score">${x.goals?.home??"?"} - ${x.goals?.away??"?"}</div><span class="pill">Winner: ${x.winner?.name||"N/A"}</span><span class="pill">Advice: ${x.advice||"N/A"}</span></div>`}else $("p"+id).textContent="No prediction available.";b.disabled=false;b.textContent="Refresh Prediction"}</script></body></html>
